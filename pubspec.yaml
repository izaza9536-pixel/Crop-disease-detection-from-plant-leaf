name: crop_disease_app
description: "CropCare AI - Crop disease detection app with offline TFLite inference, by Izaz Ahmad"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  image_picker: ^1.1.2        # camera + gallery
  camera: ^0.12.2             # scanner-style camera screen (live preview + frame)
  tflite_flutter: ^0.12.1     # on-device TensorFlow Lite inference
  image: ^4.2.0               # resize / decode the photo in Dart
  sqflite: ^2.3.3             # local SQLite history + sync queue
  path: ^1.9.0
  http: ^1.2.2                # sync with the FastAPI backend
  speech_to_text: ^7.0.0      # voice questions (mic) for the AI Assistant
  flutter_tts: ^4.2.0         # AI Assistant speaks its answers aloud

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/model.tflite     # <-- YOU copy your trained model here
    - assets/labels.txt       # 32 classes, included in this package
    - assets/plants_bg.jpg    # plants background (bottom of home screen)
    - assets/logo.png         # CropCare AI Logo 2 - AI Scan Leaf
